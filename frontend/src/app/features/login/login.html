<section class="auth-card">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <div>
      <label for="email">E-mail</label>

      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      >
    </div>

    <div>
      <label for="senha">Senha</label>

      <input
        id="senha"
        type="password"
        name="senha"
        [(ngModel)]="senha"
        required
      >
    </div>

    <button type="submit">Entrar</button>
  </form>

  <a routerLink="/register">Criar uma conta</a>
</section>
